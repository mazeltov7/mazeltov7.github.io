<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground - 石川 佑樹</title>
  <meta name="description" content="石川 佑樹の実験的プロジェクト集">
  <link rel="icon" href="../images/favicon.jpg" type="image/jpeg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding-bottom: 3rem;
    }

    .header {
      margin-bottom: 2rem;
    }

    .back-link {
      font-size: 0.8rem;
      color: #a8a29e;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: #57534e;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 1rem;
      letter-spacing: 0.02em;
    }

    .page-description {
      font-size: 0.85rem;
      color: #78716c;
      margin-top: 0.4rem;
      line-height: 1.6;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .project-card {
      background: #fff;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: block;
    }

    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .project-card:active {
      transform: translateY(0);
    }

    .project-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .project-description {
      font-size: 0.8rem;
      color: #78716c;
      line-height: 1.5;
    }

    .project-meta {
      font-size: 0.7rem;
      color: #a8a29e;
      margin-top: 0.5rem;
    }

    .empty-state {
      background: #fff;
      border-radius: 1rem;
      padding: 3rem 1.5rem;
      text-align: center;
      color: #a8a29e;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem 0.75rem; }
      .project-card { padding: 1rem 1.25rem; border-radius: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" class="back-link">&larr; Profile</a>
      <h1 class="page-title">Playground</h1>
      <p class="page-description">砂場。</p>
    </div>

    <div class="projects">
      <a href="/playground/nobel-timeline/" class="project-card">
        <div class="project-title">Nobel Prize Timeline (2016-2025)</div>
        <div class="project-description">10年間のノーベル賞受賞者を時系列で一覧。全6部門をカラーコードで表示。</div>
        <div class="project-meta">Data Visualization · Pure HTML + CSS</div>
      </a>

      <a href="/playground/my-books/" class="project-card">
        <div class="project-title">My Books (2021-2026)</div>
        <div class="project-description">読書ログの一部。本棚UIで一覧。</div>
        <div class="project-meta">Reading Log · HTML + CSS + Vanilla JS</div>
      </a>
    </div>
  </div>
</body>
</html>
