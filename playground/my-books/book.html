<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Detail - My Books</title>
  <link rel="icon" href="../../images/favicon.jpg" type="image/jpeg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .container {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    .back-link {
      font-size: 0.8rem;
      color: #a8a29e;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: #57534e; }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
      align-items: start;
    }

    .hero-cover {
      width: 140px;
      aspect-ratio: 2 / 3;
      background: #e7e5e4;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .hero-cover img { width: 100%; height: 100%; object-fit: cover; }
    .hero-cover .no-cover {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #a8a29e; font-size: 0.7rem; padding: 0.5rem; text-align: center;
    }

    .hero-info { padding-top: 0.25rem; }

    .hero-title {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .hero-en {
      font-size: 0.85rem;
      color: #78716c;
      font-style: italic;
      margin-top: 0.3rem;
    }

    .hero-meta {
      font-size: 0.8rem;
      color: #57534e;
      margin-top: 0.7rem;
      line-height: 1.6;
    }

    .hero-meta .meta-row { margin-bottom: 0.15rem; }
    .hero-meta .meta-label { color: #a8a29e; margin-right: 0.4rem; }

    .hero-tags {
      margin-top: 0.7rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .tag {
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      background: #e7e5e4;
      color: #57534e;
      border-radius: 999px;
    }

    .read-year {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      background: #1c1917;
      color: #fff;
      border-radius: 999px;
      margin-top: 0.5rem;
    }

    /* Sections */
    .section {
      margin-top: 2.5rem;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }

    .section-body {
      font-size: 0.85rem;
      color: #1c1917;
      background: #fff;
      border-radius: 0.75rem;
      padding: 1.1rem 1.25rem;
      line-height: 1.75;
    }

    .section-body p { margin-bottom: 0.6rem; }
    .section-body p:last-child { margin-bottom: 0; }
    .section-body ul, .section-body ol { padding-left: 1.4rem; margin-bottom: 0.6rem; }
    .section-body li { margin-bottom: 0.25rem; }
    .section-body h1, .section-body h2, .section-body h3 {
      margin-top: 1rem; margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .section-body h1 { font-size: 1.05rem; }
    .section-body h2 { font-size: 0.95rem; }
    .section-body h3 { font-size: 0.85rem; color: #57534e; }
    .section-body blockquote {
      border-left: 3px solid #d6d3d1;
      padding-left: 0.8rem;
      margin: 0.5rem 0;
      color: #57534e;
      font-style: italic;
    }
    .section-body code {
      background: #f5f5f4;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      font-size: 0.78rem;
      font-family: 'SF Mono', Menlo, monospace;
    }
    .section-body pre {
      background: #f5f5f4;
      padding: 0.7rem 0.9rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.5rem 0;
    }
    .section-body pre code { background: transparent; padding: 0; }
    .section-body a { color: #1c1917; text-decoration: underline; }
    .section-body hr { border: 0; border-top: 1px solid #e7e5e4; margin: 1rem 0; }

    .author-bio-meta {
      font-size: 0.7rem;
      color: #a8a29e;
      margin-bottom: 0.5rem;
    }

    .placeholder {
      color: #a8a29e;
      font-size: 0.8rem;
      font-style: italic;
    }

    .enrich-hint {
      font-size: 0.7rem;
      color: #a8a29e;
      margin-top: 0.5rem;
    }
    .enrich-hint code {
      background: #e7e5e4;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.7rem;
    }

    .loading, .not-found {
      text-align: center;
      padding: 4rem 1rem;
      color: #a8a29e;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem 0.75rem; }
      .hero {
        grid-template-columns: 110px 1fr;
        gap: 1rem;
      }
      .hero-cover { width: 110px; }
      .hero-title { font-size: 1.2rem; }
      .section-body { padding: 0.9rem 1rem; font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./" class="back-link">&larr; My Books</a>
    <div id="content">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script>
    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function bookKey(book) {
      if (book.cover) {
        var m = book.cover.match(/m\.media-amazon\.com\/images\/P\/([A-Z0-9]{10})/);
        if (m) return m[1];
      }
      return book.title.replace(/[\/\\?#&%]+/g, '-');
    }

    function getQueryParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function findBook(data, id) {
      var years = Object.keys(data);
      for (var i = 0; i < years.length; i++) {
        var year = years[i];
        var books = data[year];
        for (var j = 0; j < books.length; j++) {
          if (bookKey(books[j]) === id) {
            return { book: books[j], year: year };
          }
        }
      }
      return null;
    }

    function renderHero(book, year) {
      var coverHtml = book.cover
        ? '<img src="' + esc(book.cover) + '" alt="' + esc(book.title) + '">'
        : '<div class="no-cover">' + esc(book.title) + '</div>';

      var metaRows = '';
      if (book.author) {
        metaRows += '<div class="meta-row"><span class="meta-label">著者</span>' + esc(book.author) + '</div>';
      }
      if (book.publisher) {
        metaRows += '<div class="meta-row"><span class="meta-label">出版社</span>' + esc(book.publisher) + '</div>';
      }
      if (book.publishedYear) {
        metaRows += '<div class="meta-row"><span class="meta-label">原著発行</span>' + esc(String(book.publishedYear)) + '年</div>';
      }

      var tagsHtml = '';
      if (book.themes && book.themes.length) {
        tagsHtml = '<div class="hero-tags">' +
          book.themes.map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
          '</div>';
      }

      return '<div class="hero">' +
        '<div class="hero-cover">' + coverHtml + '</div>' +
        '<div class="hero-info">' +
          '<h1 class="hero-title">' + esc(book.title) + '</h1>' +
          (book.titleEn ? '<div class="hero-en">' + esc(book.titleEn) + '</div>' : '') +
          '<div class="read-year">' + esc(year) + ' 読了</div>' +
          '<div class="hero-meta">' + metaRows + '</div>' +
          tagsHtml +
        '</div>' +
      '</div>';
    }

    function renderEra(book) {
      if (!book.era) {
        return '<div class="section">' +
          '<h2 class="section-title">📖 時代背景</h2>' +
          '<div class="section-body"><span class="placeholder">未登録</span>' +
            '<div class="enrich-hint">情報を追加するには <code>/enrich-book ' + esc(book.title) + '</code> を Claude Code で実行</div>' +
          '</div>' +
        '</div>';
      }
      return '<div class="section">' +
        '<h2 class="section-title">📖 時代背景</h2>' +
        '<div class="section-body">' + marked.parse(book.era) + '</div>' +
      '</div>';
    }

    function renderAuthorBio(book) {
      if (!book.authorBio || !book.authorBio.summary) {
        return '<div class="section">' +
          '<h2 class="section-title">✍ 著者について</h2>' +
          '<div class="section-body"><span class="placeholder">未登録</span></div>' +
        '</div>';
      }
      var bio = book.authorBio;
      var meta = '';
      if (bio.born || bio.died) {
        meta = '<div class="author-bio-meta">' +
          (bio.born ? bio.born : '?') + ' – ' + (bio.died ? bio.died : '現在') +
          '</div>';
      }
      return '<div class="section">' +
        '<h2 class="section-title">✍ 著者について</h2>' +
        '<div class="section-body">' + meta + marked.parse(bio.summary) + '</div>' +
      '</div>';
    }

    var UNLOCK_STORAGE_KEY = 'mybooks-unlocked';

    function isNotesUnlocked() {
      try { return localStorage.getItem(UNLOCK_STORAGE_KEY) === '1'; }
      catch (e) { return false; }
    }

    function renderNotes(noteText) {
      if (!isNotesUnlocked()) return '';
      if (noteText === null) {
        return '<div class="section">' +
          '<h2 class="section-title">📝 自分のメモ</h2>' +
          '<div class="section-body"><span class="placeholder">まだメモなし</span></div>' +
        '</div>';
      }
      return '<div class="section">' +
        '<h2 class="section-title">📝 自分のメモ</h2>' +
        '<div class="section-body">' + marked.parse(noteText) + '</div>' +
      '</div>';
    }

    function notFound(id) {
      return '<div class="not-found">指定された本が見つかりません<br><small>id: ' + esc(id || '(なし)') + '</small></div>';
    }

    function loadNote(key) {
      return fetch('./notes/' + encodeURIComponent(key) + '.md')
        .then(function(r) {
          if (!r.ok) return null;
          return r.text();
        })
        .catch(function() { return null; });
    }

    var id = getQueryParam('id');
    if (!id) {
      document.getElementById('content').innerHTML = notFound(null);
    } else {
      Promise.all([
        fetch('./books-data.json').then(function(r) { return r.json(); }),
        loadNote(id)
      ]).then(function(results) {
        var data = results[0];
        var noteText = results[1];
        var found = findBook(data, id);
        if (!found) {
          document.getElementById('content').innerHTML = notFound(id);
          return;
        }
        document.title = found.book.title + ' - My Books';
        var html = renderHero(found.book, found.year) +
                   renderEra(found.book) +
                   renderAuthorBio(found.book) +
                   renderNotes(noteText);
        document.getElementById('content').innerHTML = html;
      }).catch(function(err) {
        console.error(err);
        document.getElementById('content').innerHTML = '<div class="loading">読み込み失敗</div>';
      });
    }
  </script>

</body>
</html>
