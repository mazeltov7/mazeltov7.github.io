<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Books - 石川 佑樹</title>
  <meta name="description" content="石川 佑樹の読書記録 (2021-2026)">
  <link rel="icon" href="../../images/favicon.jpg" type="image/jpeg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding-bottom: 3rem;
    }

    .header { margin-bottom: 2rem; }

    .back-link {
      font-size: 0.8rem;
      color: #a8a29e;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: #57534e; }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 1rem;
      letter-spacing: 0.02em;
    }

    .page-description {
      font-size: 0.85rem;
      color: #78716c;
      margin-top: 0.4rem;
      line-height: 1.6;
    }

    .stats {
      font-size: 0.75rem;
      color: #a8a29e;
      margin-top: 0.5rem;
    }

    /* Shelf Section */
    .shelf-section { margin-bottom: 1.5rem; }

    .shelf-header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
      padding-left: 0.25rem;
    }

    .year-label {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1c1917;
    }

    .book-count {
      font-size: 0.7rem;
      color: #a8a29e;
      font-weight: 400;
    }

    /* Shelf Container */
    .shelf {
      background: #fff;
      border-radius: 1rem;
      overflow: hidden;
    }

    .books {
      display: flex;
      gap: 3px;
      overflow-x: auto;
      padding: 1.25rem 1rem 0.75rem;
      align-items: flex-end;
      min-height: 150px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #d6d3d1 transparent;
    }

    .books::-webkit-scrollbar { height: 3px; }
    .books::-webkit-scrollbar-track { background: transparent; }
    .books::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 2px; }

    /* Shelf Board */
    .shelf-board {
      height: 6px;
      background: linear-gradient(180deg, #d6d3d1 0%, #e7e5e4 100%);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* Detail Strip */
    .shelf-detail {
      padding: 0 1rem;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease, padding 0.2s ease;
    }

    .shelf-detail.visible {
      max-height: 80px;
      padding: 0.6rem 1rem;
    }

    .shelf-detail-inner {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .shelf-detail .d-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #1c1917;
      line-height: 1.4;
    }

    .shelf-detail .d-en {
      font-size: 0.65rem;
      color: #78716c;
      font-style: italic;
    }

    .shelf-detail .d-author {
      font-size: 0.68rem;
      color: #78716c;
    }

    .shelf-detail .d-publisher {
      font-size: 0.62rem;
      color: #a8a29e;
    }

    .shelf-detail .d-sep {
      color: #d6d3d1;
      font-size: 0.6rem;
    }

    /* Book Spine */
    .book {
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
      outline: none;
    }

    .spine {
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 1px 3px 2px 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset -2px 0 3px rgba(0,0,0,0.12), 1px 0 2px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }

    .spine::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.06) 100%);
      pointer-events: none;
    }

    .book:hover .spine,
    .book:focus .spine {
      transform: translateY(-6px);
      box-shadow: inset -2px 0 3px rgba(0,0,0,0.12), 2px 4px 8px rgba(0,0,0,0.12);
    }

    .book.active .spine {
      transform: translateY(-6px);
      box-shadow: inset -2px 0 3px rgba(0,0,0,0.12), 2px 4px 8px rgba(0,0,0,0.15);
    }

    .spine-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.55rem;
      color: rgba(255,255,255,0.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: calc(100% - 12px);
      padding: 6px 0;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: #a8a29e;
      font-size: 0.85rem;
    }

    /* Cover Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1.5rem;
    }

    .modal-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #fff;
      border-radius: 1rem;
      max-width: 300px;
      width: 100%;
      overflow: hidden;
      transform: translateY(12px) scale(0.97);
      transition: transform 0.2s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-overlay.visible .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #e7e5e4;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-cover .no-cover {
      color: #a8a29e;
      font-size: 0.8rem;
      text-align: center;
      padding: 1rem;
      line-height: 1.5;
    }

    .modal-info {
      padding: 1rem 1.25rem 1.25rem;
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.4;
      color: #1c1917;
    }

    .modal-en {
      font-size: 0.75rem;
      color: #78716c;
      font-style: italic;
      margin-top: 0.15rem;
    }

    .modal-author {
      font-size: 0.75rem;
      color: #78716c;
      margin-top: 0.4rem;
    }

    .modal-publisher {
      font-size: 0.68rem;
      color: #a8a29e;
      margin-top: 0.15rem;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: 1.5rem 0.75rem; }
      .shelf { border-radius: 0.75rem; }
      .books { padding: 1rem 0.75rem 0.6rem; min-height: 130px; }
      .spine { width: 26px; }
      .spine-title { font-size: 0.5rem; }
      .shelf-detail.visible { padding: 0.5rem 0.75rem; }
      .modal-card { max-width: 260px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/playground/" class="back-link">&larr; Playground</a>
      <h1 class="page-title">My Books</h1>
      <p class="page-description">Instagramストーリーに記録してきた読書ログ。</p>
      <div class="stats" id="stats"></div>
    </div>
    <div id="shelves">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-cover" id="modal-cover"></div>
      <div class="modal-info">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-en" id="modal-en"></div>
        <div class="modal-author" id="modal-author"></div>
        <div class="modal-publisher" id="modal-pub"></div>
      </div>
    </div>
  </div>

  <script>
    var COLORS = [
      '#7c6f5e', '#5e7c6b', '#7c5e6b', '#5e6a7c',
      '#8a7e6a', '#6a7a6a', '#7a6a7a', '#6a6a7a',
      '#8e7b65', '#657b6e', '#7b6578', '#657882'
    ];

    function hash(str) {
      var h = 0;
      for (var i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function render(data) {
      var container = document.getElementById('shelves');
      var years = Object.keys(data).sort(function(a, b) { return b - a; });
      var total = 0;
      years.forEach(function(y) { total += data[y].length; });

      document.getElementById('stats').textContent =
        total + ' books \u00b7 ' + years[years.length - 1] + '\u2013' + years[0];

      container.innerHTML = '';

      years.forEach(function(year) {
        var books = data[year];
        var section = document.createElement('section');
        section.className = 'shelf-section';

        var booksHtml = books.map(function(book, i) {
          var color = COLORS[(hash(book.title) + i) % COLORS.length];
          var height = 125 + (hash(book.title + book.author) % 35);
          return '<div class="book" tabindex="0"' +
            ' data-title="' + esc(book.title) + '"' +
            ' data-author="' + esc(book.author) + '"' +
            (book.titleEn ? ' data-en="' + esc(book.titleEn) + '"' : '') +
            (book.publisher ? ' data-pub="' + esc(book.publisher) + '"' : '') +
            (book.cover ? ' data-cover="' + esc(book.cover) + '"' : '') +
            '>' +
            '<div class="spine" style="background-color:' + color + ';height:' + height + 'px">' +
              '<span class="spine-title">' + esc(book.title) + '</span>' +
            '</div>' +
          '</div>';
        }).join('');

        section.innerHTML =
          '<div class="shelf-header">' +
            '<h2 class="year-label">' + year + '</h2>' +
            '<span class="book-count">' + books.length + ' books</span>' +
          '</div>' +
          '<div class="shelf">' +
            '<div class="books">' + booksHtml + '</div>' +
            '<div class="shelf-board"></div>' +
            '<div class="shelf-detail"><div class="shelf-detail-inner"></div></div>' +
          '</div>';

        container.appendChild(section);
      });

      initInteractions();
    }

    function initInteractions() {
      var activeBook = null;
      var modal = document.getElementById('modal');
      var modalCover = document.getElementById('modal-cover');
      var modalTitle = document.getElementById('modal-title');
      var modalEn = document.getElementById('modal-en');
      var modalAuthor = document.getElementById('modal-author');
      var modalPub = document.getElementById('modal-pub');

      function openModal(book) {
        var cover = book.dataset.cover;
        var t = book.dataset.title;
        var en = book.dataset.en || '';
        var a = book.dataset.author || '';
        var pub = book.dataset.pub || '';

        if (cover) {
          modalCover.innerHTML = '<img src="' + cover + '" alt="' + t + '">';
        } else {
          modalCover.innerHTML = '<span class="no-cover">' + t + '</span>';
        }
        modalTitle.textContent = t;
        modalEn.textContent = en;
        modalEn.style.display = en ? '' : 'none';
        modalAuthor.textContent = a;
        modalAuthor.style.display = a ? '' : 'none';
        modalPub.textContent = pub;
        modalPub.style.display = pub ? '' : 'none';

        modal.classList.add('visible');
      }

      function closeModal() {
        modal.classList.remove('visible');
      }

      modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
      });

      document.querySelectorAll('.book').forEach(function(book) {
        function show() {
          var shelf = book.closest('.shelf');
          var detail = shelf.querySelector('.shelf-detail');
          var inner = detail.querySelector('.shelf-detail-inner');
          var t = book.dataset.title;
          var a = book.dataset.author;
          var en = book.dataset.en;
          var pub = book.dataset.pub;

          var html = '<span class="d-title">' + t + '</span>';
          if (en) html += ' <span class="d-en">' + en + '</span>';
          if (a) html += '<span class="d-sep">\u00b7</span><span class="d-author">' + a + '</span>';
          if (pub) html += '<span class="d-sep">\u00b7</span><span class="d-publisher">' + pub + '</span>';

          inner.innerHTML = html;
          detail.classList.add('visible');

          if (activeBook && activeBook !== book) activeBook.classList.remove('active');
          book.classList.add('active');
          activeBook = book;
        }

        function hide() {
          var shelf = book.closest('.shelf');
          var detail = shelf.querySelector('.shelf-detail');
          detail.classList.remove('visible');
          book.classList.remove('active');
          if (activeBook === book) activeBook = null;
        }

        book.addEventListener('mouseenter', show);
        book.addEventListener('mouseleave', hide);
        book.addEventListener('focus', show);
        book.addEventListener('blur', hide);
        book.addEventListener('click', function() { openModal(book); });
      });
    }

    fetch('./books-data.json')
      .then(function(r) { return r.json(); })
      .then(render)
      .catch(function(err) {
        console.error(err);
        document.getElementById('shelves').innerHTML =
          '<div class="loading">Failed to load data.</div>';
      });
  </script>
</body>
</html>
